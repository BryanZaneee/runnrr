<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyAgent — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css?v=1" />
  <link rel="stylesheet" href="app.css?v=1" />
</head>
<body class="login-page">
  <section class="panel login-card">
    <h1 style="margin:0 0 14px;font-size:18px;">EasyAgent</h1>
    <form id="login-form" autocomplete="on">
      <label>
        Email
        <input id="email" type="email" required autocomplete="email" />
      </label>
      <label>
        Password
        <input id="password" type="password" required autocomplete="current-password" />
      </label>
      <p id="login-error" class="banner banner-error hidden" role="alert"></p>
      <div class="login-actions">
        <button type="button" id="sign-in" class="btn">Sign in</button>
        <button type="button" id="sign-up" class="btn">Sign up</button>
      </div>
    </form>
  </section>
  <script type="module" src="login.js"></script>
</body>
</html>
