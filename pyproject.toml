[project]
name = "easyagent"
version = "0.1.0"
description = "EasyAgent — portable framework for reusable agentic AI across Anthropic, OpenAI, Gemini, Moonshot Kimi, and DeepSeek."
readme = "README.md"
# voyageai (default RAG backend) does not support Python 3.14+ yet.
requires-python = ">=3.11,<3.14"
authors = [{ name = "Bryan Zane Smith", email = "bzane09@gmail.com" }]
license = { text = "MIT" }

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
    "asyncpg>=0.30.0",
    "pyjwt[crypto]>=2.9.0",
]

[project.optional-dependencies]
rag = [
    "sqlite-vec>=0.1.6",
    "voyageai>=0.3.0",
]
rag-local = [
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
